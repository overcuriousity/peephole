[package]
name = "peephole"
version = "0.1.0"
edition = "2024"

[lib]
name = "peephole"
path = "src/lib.rs"

[[bin]]
name = "peephole"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.14"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
flate2 = "1"
ipnet = { version = "2", features = ["serde"] }
maxminddb = "0.26"
quick-xml = "0.37"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "ipnetwork"] }
tar = "0.4"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
