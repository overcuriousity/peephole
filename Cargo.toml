[package]
name = "peephole"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
# Oldest toolchain that builds this crate (sqlx 0.9 needs 1.94); CI checks it.
rust-version = "1.94"
build = "build.rs"

[lib]
name = "peephole"
path = "src/lib.rs"

[[bin]]
name = "peephole"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "60"
askama = "0.16"
aws-lc-rs = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-signed"] }
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2.2"
csv = "1.4"
data-encoding = "2"
flate2 = "1"
futures = "0.3"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
ipnet = { version = "2", features = ["serde"] }
maxminddb = "0.32"
md-5 = "0.11"
# Only the Arrow writer/reader, and zstd for the exported Parquet files.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
quick-xml = "0.42"
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1"
reqwest = { version = "0.13", features = ["rustls", "gzip", "json", "cookies", "form", "query"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "ipnetwork"] }
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "1.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# danger-allow-state-serialisation lets us persist ceremony state. It is held
# server-side (webauthn_states table), keyed by a random id, single-use and
# short-lived — the client only ever sees the id, never the challenge or the
# credential list — so the "attacker controls the state" risk does not apply.
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
x509-parser = "0.16"
zstd = "0.14"

[dev-dependencies]
bytes = "1"
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs-proto = "0.5"

[profile.release]
# Smaller, faster release binary. panic stays "unwind": a panicking request
# task must not take the whole daemon down.
lto = "thin"
codegen-units = 1
strip = true
