[package]
name = "peephole"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "peephole"
path = "src/lib.rs"

[[bin]]
name = "peephole"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "60"
askama = "0.16"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-signed"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
data-encoding = "2"
flate2 = "1"
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
maxminddb = "0.32"
parquet = "60"
quick-xml = "0.42"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["rustls", "gzip", "json", "cookies", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "ipnetwork"] }
tar = "0.4"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
zstd = "0.14"

[dev-dependencies]
bytes = "1"
serde_urlencoded = "0.7"
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs-proto = "0.5"
