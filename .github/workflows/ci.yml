name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

      - name: build (release)
        run: cargo build --release --locked

      - name: shellcheck install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh tests/install-smoke.sh

  installer:
    name: install.sh smoke (apt container)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: build release binary (stamped like the smoke test's first tarball)
        run: PEEPHOLE_VERSION=test1 cargo build --release --locked
      # The container's glibc must be >= the build host's, so use the runner's own release.
      - name: run installer smoke test in ubuntu:24.04
        run: docker run --rm -v "$PWD":/src -w /src ubuntu:24.04 bash tests/install-smoke.sh
