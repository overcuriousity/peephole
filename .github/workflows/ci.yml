name: CI

# One workflow for checks and releases: a release is published only by a run
# whose checks all passed (the publish jobs need every other job).
#   push to master   -> checks, then the rolling "latest" prerelease
#   push of a v* tag -> checks, then an immutable versioned release
#   pull request     -> checks only
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Read-only unless a job asks for more; only the publish jobs do.
permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Runs for master and
  # tags each get their own group: they all finish, and publish-latest sorts
  # out their order.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / test / shell and deploy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nginx-light libnginx-mod-stream
          shellcheck install.sh tests/install-smoke.sh tests/deploy-check.sh tools/package.sh

      # deploy/nginx.example.conf equals install.sh's output, nginx -t accepts
      # every role combination, systemd-analyze verify accepts the unit.
      # Root: nginx -t opens the listen sockets.
      - name: deploy files
        run: sudo bash tests/deploy-check.sh

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new advisory against a dependency shows up here without blocking
    # unrelated work; licenses, bans and sources must pass.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned release binary, checksum-verified. Not the Docker action:
      # Docker Hub rate-limits unauthenticated pulls and blocked releases.
      - name: Install cargo-deny
        run: |
          v=0.20.2
          a="cargo-deny-$v-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/$a.tar.gz" -o deny.tgz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tgz" | sha256sum -c -
          tar -xzf deny.tgz "$a/cargo-deny"
          mv "$a/cargo-deny" cargo-deny
      - name: cargo deny check
        run: ./cargo-deny check ${{ matrix.checks }}

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain Cargo.toml names
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-msrv
      - name: cargo check
        run: cargo +"$MSRV" check --locked --all-targets

  # The binaries that get published. No rust-cache here: a release is built
  # from a clean state, never from a cache another run wrote.
  build:
    name: release build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (glibc 2.35): the binaries must run on Debian 12 (2.36) and
          # Ubuntu 22.04+.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master)
        with:
          toolchain: stable

      # A versioned release is named after its tag, and the tag must be the
      # version in Cargo.toml (v0.1.0 for version = "0.1.0").
      - name: Build name (tag must match Cargo.toml)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            want="v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
            if [ "$GITHUB_REF_NAME" != "$want" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version ($want)"
              exit 1
            fi
            echo "BUILD=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "BUILD=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          fi

      - name: Build release binary
        run: PEEPHOLE_VERSION="$BUILD" PEEPHOLE_COMMIT="$GITHUB_SHA" cargo build --release --locked

      - name: Package tarball
        run: tools/package.sh target/release/peephole "${{ matrix.target }}" "$BUILD" "$GITHUB_SHA" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peephole-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  installer:
    name: install.sh smoke (ubuntu-24.04)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The binary the release would publish, not a rebuild.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: peephole-x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the release binary
        run: tar -xzf dist/peephole-x86_64-unknown-linux-gnu.tar.gz -C dist
      # No container: Docker Hub rate-limits unauthenticated pulls and blocked
      # releases. The runner's glibc (24.04) is >= the build host's (22.04).
      - name: run installer smoke test
        run: sudo PEEPHOLE_BIN=dist/peephole-x86_64-unknown-linux-gnu/peephole bash tests/install-smoke.sh

  publish-latest:
    name: publish the rolling "latest" prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, deny, msrv, build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write # release files and the tag
      id-token: write # provenance attestation (Sigstore certificate)
      attestations: write
    # One publish at a time; a newer run waits instead of racing.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: peephole-*
          merge-multiple: true
          path: dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The release is updated in place, never deleted: installs keep working
      # while it changes. Tarballs go first and their checksums after, so an
      # install in between sees a mismatch, which install.sh retries. The tag
      # moves to the new commit last (the tarballs' VERSION files name the
      # commit too).
      - name: Update the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # A run that finishes after a newer one must not put an older build
          # back: skip when the published commit is ahead of this one.
          published="$(gh api "repos/$GH_REPO/git/ref/tags/latest" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$published" ]; then
            status="$(gh api "repos/$GH_REPO/compare/${published}...${GITHUB_SHA}" --jq .status)"
            if [ "$status" = behind ]; then
              echo "latest has $published, which is newer than $GITHUB_SHA; not publishing"
              exit 0
            fi
          fi
          cp "$BUNDLE" dist/peephole-provenance.sigstore.json
          title="latest (rolling build of master)"
          notes="Rolling prerelease built from master commit ${GITHUB_SHA}. Pinned, immutable versions are the v* releases."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
          gh release upload latest --clobber dist/*.tar.gz
          gh release upload latest --clobber dist/*.tar.gz.sha256 dist/peephole-provenance.sigstore.json
          # The release's tag is lightweight: force-move its ref (a no-op for
          # a release just created at this commit).
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit latest --prerelease --title "$title" --notes "$notes"

  publish-release:
    name: publish the versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, deny, msrv, build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: peephole-*
          merge-multiple: true
          path: dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # Created once with all its files; a published version is never changed.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag exists already; versioned releases are not replaced"
            exit 1
          fi
          cp "$BUNDLE" dist/peephole-provenance.sigstore.json
          {
            echo "peephole ${tag}, built from commit ${GITHUB_SHA}."
            echo
            echo "Install this version, with the installer from the same tag:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/${tag}/install.sh | sudo PEEPHOLE_VERSION=${tag} bash"
            echo '```'
            echo
            echo "Verify a download: gh attestation verify peephole-<target>.tar.gz --repo ${GH_REPO}"
          } > notes.md
          gh release create "$tag" --verify-tag --title "peephole ${tag}" --notes-file notes.md \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/peephole-provenance.sigstore.json
