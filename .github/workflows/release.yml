name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ASSET: peephole-x86_64-unknown-linux-gnu

jobs:
  rolling-release:
    name: Build binary and update rolling "latest" prerelease
    # 22.04 (glibc 2.35): the binary must run on Debian 12 (2.36) and Ubuntu 22.04+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          # Own key: the runner moved to 22.04 and a cache restored from the
          # old image left fingerprints without the matching rlibs.
          prefix-key: v1-rust-release-22.04

      - name: Build release binary
        run: PEEPHOLE_VERSION="${GITHUB_SHA::12}" cargo build --release --locked

      - name: Package tarball
        run: |
          staging="$ASSET"
          mkdir -p "$staging"
          cp target/release/peephole "$staging/"
          cp -r rules "$staging/rules"
          mkdir -p "$staging/deploy"
          cp deploy/peephole.service deploy/config.example.toml deploy/nginx.example.conf "$staging/deploy/"
          printf '%s %s\n' "${GITHUB_SHA::12}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$staging/VERSION"
          tar -czf "$ASSET.tar.gz" "$staging"
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"

      - name: Update rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          # Delete previous rolling release + tag (ignore if absent)
          gh release delete latest --repo "$repo" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --repo "$repo" \
            --title "latest (rolling build of master)" \
            --notes "Rolling prerelease built from master commit ${{ github.sha }}." \
            --prerelease \
            "$ASSET.tar.gz" "$ASSET.tar.gz.sha256"
