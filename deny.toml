# cargo-deny: what CI (the "deny" jobs) accepts in Cargo.lock.
# https://embarkstudios.github.io/cargo-deny/
# Run locally: cargo deny check

[graph]
# The published binaries are Linux builds.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Every RustSec advisory (vulnerable, unsound, unmaintained) fails the
# advisories check. To accept one knowingly, list it with a reason:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "…" }]
ignore = []

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft; webauthn-rs).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate (rand 0.8/0.9/0.10 through cookie and
# webauthn-rs, for one) are common in this tree: shown, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies are not wildcards.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
