{# Canary marks of request row `r` (admin only). #}
{% if r.canary_served %}<a class="canary-mark" href="/admin/links/canaries/served/{{ r.id }}" title="Answered with a decoy that carried canaries: what it served and who used it" aria-label="Canaries served to request {{ r.id }}"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="8" r="2.75"/><path d="M7.75 8h6.25M12 8v2.5M14 8v1.75"/></svg></a>{% endif %}
{% if let Some(h) = r.canary_used %}<a class="canary-mark used" href="{% if let Some(s) = r.canary_from %}/admin/links/canaries/served/{{ s }}{% else %}/admin/links/canary/{{ h }}{% endif %}" title="Used a canary harvested earlier: the decoy that served it" aria-label="Canary used by request {{ r.id }}: where it was served"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="8" r="2.75"/><path d="M7.75 8h6.25M12 8v2.5M14 8v1.75"/><path d="M6.5 2.5H2m0 0l1.5-1.5M2 2.5l1.5 1.5"/></svg></a>{% endif %}
