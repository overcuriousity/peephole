{# The verdict strip (admin::signals) above the provider cards; `signals`: Vec<Signal>. #}
{% if !signals.is_empty() %}
<ul class="signals" aria-label="Signals">
  {% for s in signals %}<li class="signal" data-tone="{{ s.tone }}"><span class="signal-label">{{ s.label }}</span><span class="signal-value">{{ s.value }}</span>{% if let Some(m) = s.meter %}<svg class="signal-meter" viewBox="0 0 100 4" preserveAspectRatio="none" aria-hidden="true"><rect class="track" width="100" height="4" rx="2"/><rect class="fill" width="{{ m }}" height="4" rx="2"/></svg>{% endif %}</li>{% endfor %}
</ul>
{% endif %}
