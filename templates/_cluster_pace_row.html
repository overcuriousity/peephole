<tr>
  <td><b>{{ m.name }}</b> <span class="mono muted">{{ m.short }}</span>
    <form id="pace-{{ m.short }}" method="post" action="/admin/cluster/pace"><input type="hidden" name="key" value="{{ m.key }}"></form></td>
  {% match m.pace %}{% when Some(p) %}
  <td><input form="pace-{{ m.short }}" type="number" name="max_workers" min="0" max="16" value="{{ p.max_workers }}" size="3" required></td>
  <td><input form="pace-{{ m.short }}" type="number" name="max_scans_per_hour" min="0" max="3600" value="{{ p.max_scans_per_hour }}" size="5" required></td>
  <td><input form="pace-{{ m.short }}" type="number" name="timeout_minutes" min="1" max="240" step="any" value="{{ m.timeout_min }}" size="4" required></td>
  <td><button form="pace-{{ m.short }}" class="btn btn-sm" type="submit">Save</button></td>
  {% when None %}<td colspan="4" class="muted">pace not reported yet</td>{% endmatch %}
</tr>
