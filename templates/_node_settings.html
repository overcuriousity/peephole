<form method="post" action="/admin/cluster/settings" class="filters">
  <input type="hidden" name="base_version" value="{{ settings.version }}">
  <label class="check" title="{{ settings.listener_missing }}"><input type="checkbox" name="listener"{% if settings.listener %} checked{% endif %}{% if !settings.listener && !settings.listener_missing.is_empty() %} disabled{% endif %}> Trap</label>
  <label class="check" title="{{ settings.scanner_missing }}"><input type="checkbox" name="scanner"{% if settings.scanner %} checked{% endif %}{% if !settings.scanner && !settings.scanner_missing.is_empty() %} disabled{% endif %}> Scanner</label>
  <label class="check" title="{{ settings.web_missing }}"><input type="checkbox" name="web"{% if settings.web %} checked{% endif %}{% if !settings.web && !settings.web_missing.is_empty() %} disabled{% endif %}> Web interface</label>
  <button class="btn btn-sm" type="submit">Save</button>
  <span class="muted small">version {{ settings.version }}</span>
</form>
<p class="muted">Greyed out: not configured (hover). Web off removes these pages; restore: <code>peephole settings reset roles.web</code></p>
