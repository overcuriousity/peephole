<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peephole — export</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  body { font-family: system-ui, sans-serif; background:#f8fafc; color:#0f172a; margin:0; }
  header { background:#0f172a; color:#f8fafc; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; }
  nav a { color:#93c5fd; margin-right:1rem; }
  nav form { display:inline; }
  nav button { background:none; border:0; color:#93c5fd; cursor:pointer; font-size:1rem; text-decoration:underline; }
  main { max-width:1100px; margin:2rem auto; padding:0 1rem; }
  form.filters { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:1rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:end; }
  form.filters label { display:flex; flex-direction:column; font-size:.85rem; color:#64748b; }
  form.filters input, form.filters select { padding:.4rem; border:1px solid #cbd5e1; border-radius:6px; }
  button { background:#2563eb; color:#fff; border:0; border-radius:6px; padding:.45rem .9rem; cursor:pointer; }
  a { color:#2563eb; }
</style></head><body>
<header>
  <span style="display:flex;align-items:center;gap:.6rem"><img src="/logo.svg" alt="" style="height:32px;width:32px;border-radius:8px"><strong><a href="/" style="color:#f8fafc;text-decoration:none">peephole</a></strong></span>
  <nav>
    <a href="/requests">Requests</a>
    <a href="/inbox">Inbox</a>
    <a href="/keys">Keys</a>
    <a href="/export">Export</a>
    <form method="post" action="/logout"><button type="submit">Logout</button></form>
  </nav>
</header>
<main>
<h1>Export requests</h1>
<form class="filters" method="get" action="/export/download">
  <label>Format
    <select name="format">
      <option value="csv">CSV</option>
      <option value="jsonl">Timesketch JSONL</option>
      <option value="parquet">Parquet</option>
    </select>
  </label>
  <label>From <input name="from" type="datetime-local"></label>
  <label>To <input name="to" type="datetime-local"></label>
  <label>IP <input name="ip"></label>
  <label>Label <input name="label"></label>
  <label>Min severity <input name="min_severity" type="number" min="0" max="4" size="4"></label>
  <button type="submit">Download</button>
</form>
</main>
</body></html>
