# peephole configuration
# Copy to /etc/peephole/config.toml and edit.

# What this deployment does. All three are on when the section is absent.
# [roles]
# listener = true   # trap listener (needs trap_listen)
# scanner  = true   # nmap counter-scans (needs nmap)
# web      = true   # wall of shame + admin area (needs admin_listen, [webauthn])

# Trap listener: your reverse proxy sends requests that match no real site here.
# With nothing in front, the trap takes the public ports itself:
# trap_listen = "0.0.0.0:80" and trap_tls_listen = "0.0.0.0:443".
trap_listen = "0.0.0.0:8080"
# Optional TLS trap listener: peephole terminates TLS itself and keeps the
# handshake (raw ClientHello, JA4). The proxy forwards TLS for unknown names
# untouched (nginx: stream + ssl_preread); a peer in trusted_proxies must
# start each connection with a PROXY protocol header (v1 or v2).
# trap_tls_listen = "127.0.0.1:8081"
# trap_tls_cert = "/etc/peephole/trap.crt"   # PEM; without cert and key a
# trap_tls_key  = "/etc/peephole/trap.key"   # self-signed one is made at start
# Admin listener: nginx terminates TLS in front of this.
admin_listen = "127.0.0.1:8443"

# SQLite database (WAL mode) and data dir (MaxMind DBs, Tor exit list snapshot).
database_path = "/var/lib/peephole/peephole.db"
data_dir = "/var/lib/peephole"

# Keep records and history of the last N days on this node only; 0 (default)
# keeps everything. At least 7. In a cluster the other nodes keep theirs: this
# node drops its old copies and log entries and serves only what it holds,
# members keeping everything serve the rest (see docs/cluster.md).
# retention_days = 0

# The signature rules (rules/*.toml in the source) are built into the binary;
# changing them means a new build. An older config's rules_dir is ignored.

# Proxies whose X-Forwarded-For header is trusted for the real client IP.
# Every host in these ranges is believed about the client address: list only
# the proxy (nginx on this machine: ["127.0.0.1/32", "::1/128"]; nothing in
# front of the trap: []).
trusted_proxies = ["10.0.0.5/32"]

# Trap listener behaviour. All optional; the defaults are shown.
# [trap]
# record_rate  = 10    # requests/second one IP may have recorded in full; 0 = no limit
# record_burst = 100   # ...after a burst of this many
# sample_every = 20    # over the limit: record 1 in N in full (it carries the "unrecorded" count); the rest leave light rows
# skip_log_rate = 100  # light rows (time, method, path) per IP and second for the rest; past it only counted; 0 = no limit
# helper_prefix = ""   # path prefix for /claim, /collect, /panel, /collect.js (e.g. "/_a7f3"), so the
#                      # trap page's helpers do not give peephole away on every vhost
# Tarpit: sources whose requests reached severity 4 get a slow 200 for an
# hour after, while the pool has room (then the normal answer).
# tarpit_pool = 256           # connections held at once; 0 = no tarpit
# tarpit_per_source = 8       # ...from one source (IPv6 by /64)
# tarpit_hold_secs = 600      # longest a connection is held
# tarpit_drip_bytes = 1       # bytes sent per drip
# tarpit_drip_every_secs = 10 # seconds between drips (below the hold)
# Legacy MCP HTTP+SSE decoy: streams held open for scanners probing GET /sse,
# in a pool of their own.
# mcp_sse_pool = 64           # streams held at once; 0 = none
# mcp_sse_per_source = 2      # ...from one source (IPv6 by /64)
# mcp_sse_hold_secs = 300     # longest a stream is held

[webauthn]
# Public domain the dashboard is reached at through nginx (FIDO2 relying party).
rp_id = "peephole.example.net"
origin = "https://peephole.example.net"
rp_name = "peephole"
# Secure flag on the admin session cookie. Keep true behind TLS; only
# integration tests over plain http set this to false.
secure_cookies = true

[maxmind]
# Optional. Without credentials this node cannot look up GeoIP data itself; in a cluster it then shows what other members looked up. The databases stay on the node that downloaded them.
# GeoLite2 account credentials (https://www.maxmind.com/en/accounts/current/license-key).
account_id = "123456"
license_key = "testkey"

# --- Optional threat-intel APIs --------------------------------------------
# Each provider is off unless its section is present. Keys stay on this node;
# in a cluster the lookup results are shared, so one member with a key serves
# all. Every IP is looked up once by one node; results appear only in the
# admin area (IP page, IP list filters, Admin -> Export).

[enrichment]
# When an IP that was looked up comes back, it is looked up again after N days
# since the last lookup, then 1.5 N, 2.25 N, ... An IP that never comes back
# is never looked up again. 0 = never again.
refresh_after_days = 30

# Cluster only: the part of each API provider's budget that paid lookups of
# other members (and your own on-demand lookups) may use. 0.2 = a fifth.
# on_demand_share = 0.2

# [credits]
# # Cluster only. A scanner runs this share of the other nodes' fresh scans
# # again to check them (audits earn nothing; 0 = audit nothing).
# audit_share = 0.05
# # Cluster only. The share of this node's credits its own scan jobs may hold
# # or pay for in a day: a funded job pays its scanner on delivery
# # (0 = grant every job unfunded).
# scan_share = 0.5

# [abuseipdb]
# # Abuse reports per IP (https://www.abuseipdb.com/account/api).
# api_key = "..."
# daily_limit = 1000        # checks per UTC day (free plan: 1000)
# max_age_days = 90         # count reports from the last N days (1-365)

# [shodan]
# # Open ports, services, OS and CVEs (https://account.shodan.io). Host
# # lookups need a membership or a paid plan; Shodan allows 1 request/s.
# api_key = "..."
# daily_limit = 0           # lookups per UTC day; 0 = no local cap

# [internetdb]
# # Shodan InternetDB: ports, tags and CVEs from weekly data, IPv4 only, no
# # key. Free for non-commercial use only. Skips IPs Shodan already answered.
# enabled = true
# daily_limit = 0           # 0 = no local cap

[scan]
max_workers = 2            # concurrent nmap subprocesses (2–16)
timeout_secs = 1800        # per-scan wall-clock timeout (adjustable in the admin queue page)
level4_timeout_factor = 2  # level 4 (all ports, -sV -O, scripts) gets this many times timeout_secs, at most 12 h
level4_max_share = 0.5     # at most this share of max_workers runs level 4 at once (at least one)
min_rate = 300             # level 4 sends at least this many probes per second (--min-rate);
#                            lower it on a node behind a home router
level4_udp = false         # level 4 also scans the top 50 UDP ports
rescan_cooldown_hours = 24 # per-IP rescan cooldown (one level upgrade allowed)
max_scans_per_hour = 30    # global rate cap; excess jobs stay queued
never_scan = [] # extra CIDRs this node's scanner never scans (own infra, monitoring); other cluster scanners are not bound by it
# Non-global addresses (loopback, private, CGNAT, link-local, multicast,
# reserved, NAT64/6to4 forms of those) and this node's own addresses are
# never counter-scanned regardless of never_scan.
#
# List public ranges only, e.g. your servers and monitoring:
# never_scan = ["203.0.113.0/24", "2001:db8::/32"]
# Behind 1:1 NAT (most clouds) no interface carries the public address, so
# this node does not know it as its own unless cluster.advertise names it.
# List it here: it is then never scanned and never in the blocklist, so
# requests the host itself makes to its traps (hairpin NAT) are harmless.
# install.sh fills it in from the cloud's metadata service on a first install.
# own_addresses = ["203.0.113.5"]
# nmap_path = "nmap"       # the nmap program (PATH lookup); PEEPHOLE_NMAP_PATH overrides it
#
# Bystanders: one request is easily caused by a link preview, URL scanner or
# crawler fetching a trap URL, so it earns at most this level until the IP
# sends full_scan_min_requests requests (or two with different labels).
single_request_max_level = 2  # 1-4; 4 disables the cap
full_scan_min_requests = 3
verify_crawlers = true        # skip forward-confirmed crawlers (googlebot.com, search.msn.com, ...)
# crawler_domains = ["crawler.example.org"]  # added to the built-in list
# never_scan_dir = "/etc/peephole/never_scan.d"  # local CIDR lists (*.txt, *.list, *.conf;
#                               # one CIDR per line, # comments), e.g. published crawler
#                               # ranges you download yourself; nothing is fetched
# Queue budgets against floods (0 = no limit):
prefix_max_scans = 4          # IPs per /24 (IPv4) or /64 (IPv6) queued per rescan cooldown
asn_max_per_hour = 20         # jobs queued per autonomous system per hour (needs GeoLite2)
max_queued = 5000             # queued jobs; a full queue drops its oldest lowest-level job
#                               for a higher-level one and otherwise queues nothing new
# Tor exits are never scanned. While no exit list has loaded (first start,
# check.torproject.org unreachable), "defer" holds scans of IPs whose status
# is unknown for tor_wait_hours, then refuses them; "scan" scans them anyway.
# The exit list covers IPv4 only: Tor exits reaching the trap over IPv6 are
# not recognised.
tor_unknown = "defer"
tor_wait_hours = 6
# Distributed mode: by default a scanner runs jobs backed by any member's
# requests. List node keys to trust only those members' traps (and this
# node's); [] = this node's own traps only.
# trusted_origins = ["ed25519:..."]

# Default scans are non-intrusive: no -A, no intrusive NSE scripts, timing
# capped at -T3. Level 4 sets --min-rate (min_rate above).
# Severity escalates by scope (ports, -sV, -O, discovery/safe
# scripts that neither contact third parties nor broadcast). Level 2 runs
# ssh-hostkey, ssh2-enum-algos and ssl-cert for the source's host keys and
# certificates; an override without them loses those. nmap gets a
# --host-timeout just under timeout_secs and a --script-timeout. Optional
# per-level argv overrides below; {target} is NOT used — the target IP is
# appended as the final argument. A script selector with spaces is one
# element. Example:
# A scanner that sets its own arguments for a level earns no scanner share for scans at that level (lookup credits).
# [scan.level_argv]
# 2 = ["-Pn", "-sS", "-sV", "-T3", "--top-ports", "2000"]
# 3 = ["-Pn", "-sS", "-sV", "-O", "-T3", "--top-ports", "1000", "--script", "(discovery or safe) and not (intrusive or broadcast or external or dos)"]

# What anonymous visitors of the wall of shame see.
# [public]
# show_labels = true   # rule labels (coarse categories of what an IP requested):
#                      # per-IP chips, the label filter and the label chart
# delay_minutes = 5    # a request shows on public pages (wall, IPs, blocklist)
# jitter_minutes = 5   # only after the delay plus a random 0..jitter per request
# recent_rows = 50     # rows of the wall's "Recent requests" (last 24 h)

# Distributed mode: share requests, scan queue, results and intel with other
# nodes (docs/cluster.md). Absent: standalone. The node key is
# created on first start; print it with `peephole cluster id`. Add nodes with
# the reusable invite from `peephole cluster invite` and
# `peephole cluster join <token>`, or list them below. Nobody can remove a
# member; a node leaves with `peephole cluster leave`. Open `listen` to the
# other nodes only.
# [cluster]
# node_name = "server-a"            # shown in the admin UI only
# listen    = "0.0.0.0:7443"        # RPC listener (mutual TLS, pinned keys)
# advertise = "a.example.net:7443"  # how peers reach us; omit if outbound-only
# takeover_hours = 6                # adopt an unreachable node's queued jobs after
# lease_secs     = 120              # scan lease, renewed while nmap runs
# origin_quota_mb = 20480           # stop storing a member's entries beyond this (0 = no limit)
#
# [[cluster.peers]]
# name = "server-b"
# address = "b.example.net:7443"
# public_key = "ed25519:..."
