# peephole behind nginx: admin area (TLS) and catch-all trap. The installer writes a version of this file that fits the node to /etc/peephole/nginx.example.conf.
# Copy to /etc/nginx/sites-available/peephole, adjust server_name and
# certificate paths, enable, reload nginx. Get the certificate first
# (certbot certonly --nginx) while the distribution's default site still
# serves port 80. The catch-all trap below is the default_server for port 80;
# the distribution's default site (/etc/nginx/sites-enabled/default) claims it
# too, and nginx refuses two ("duplicate default server"): remove that site.
server {
    # Works on every nginx; 1.25.1+ warns it is deprecated. There, "listen 443 ssl;"
    # plus "http2 on;" is the newer form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peephole.example.net;

    ssl_certificate     /etc/letsencrypt/live/peephole.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peephole.example.net/privkey.pem;

    # HSTS (the app also sets it; harmless to set here too).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Server-Sent Events for the live scan queue: no buffering, long timeout.
    location /admin/api/queue {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # proxy_buffering off is what actually disables buffering here; the
        # X-Accel-Buffering response header is for the upstream to send, not
        # nginx, so it is not set here.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name peephole.example.net;
    return 301 https://$host$request_uri;
}

# Catch-all trap: every request for a host name no other server block claims.
# X-Forwarded-For is set to the real peer address (never appended to what
# the client sent), and peephole trusts it only from the proxies in
# trusted_proxies.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

