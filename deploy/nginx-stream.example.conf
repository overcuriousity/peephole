# nginx stream config for peephole, generated by install.sh for a node with the
# roles listener, scanner, web. It belongs in nginx.conf's main context (outside
# http {}): install.sh writes it to /etc/nginx/peephole-stream.conf and adds
# "include /etc/nginx/peephole-stream.conf;" to /etc/nginx/nginx.conf. Needs the
# stream module (Debian/Ubuntu: libnginx-mod-stream).
#
# Port 443 is routed by server name without decrypting (ssl_preread). The
# trap reads the TLS handshake itself (JA4 fingerprint, raw ClientHello) and
# learns the client's address from the PROXY protocol header.
stream {
    map $ssl_preread_server_name $peephole_upstream {
        peephole.example.net 127.0.0.1:8444;
        default 127.0.0.1:8081;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $peephole_upstream;
        proxy_protocol on;
    }
}
